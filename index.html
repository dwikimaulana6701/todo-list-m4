<!DOCTYPE html>
<html lang="id">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo-list</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        tailwind.config = {
        theme: {
            extend: {
                colors: {},
                fontFamily: {
                sans: ["Inter", "sans-serif"],
                },
            },
            plugins: [],
            },
        };
    </script>
    </head>

    <body class="bg-gray-100 min-h-screen flex flex-col items-center md:justify-center">
        <div class="bg-white p-6 rounded-xl shadow-lg max-w-lg m-8 md:w-full">
            <div class="flex flex-col items-center mb-6">
                <h1 class="text-2xl font-bold">To-Do List</h1>
                <p id="time" class="text-gray-500 mt-1"></p>
                <div class="mt-2 text-center">
                <p class="font-semibold">Nama: Dwiki Maulana Suharto</p>
                <p class="text-sm font-semibold font-mono text-blue-500">Jabatan: Staff IT</p>
                </div>
            </div>
    
            <div class="mb-4">
                <textarea id="taskInput" rows="2" placeholder="Tulis tugas..." class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
            </div>
        
            <div class="flex flex-wrap items-center gap-2 mb-4">
                <select id="priority" class="flex-1 border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                </select>
                <input type="date" id="dueDate" class="border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                <button onclick="addTask()" class="bg-blue-500 hover:bg-blue-600 text-white rounded-lg px-4 py-2">Submit</button>
            </div>
        
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-2">To-Do</h2>
                <div id="todoList" class="flex flex-col gap-2"></div>
            </div>
        
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-2">Overdue</h2>
                <div id="overdueList" class="flex flex-col gap-2"></div>
            </div>
        
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-2">Done</h2>
                <div id="doneList" class="flex flex-col gap-2"></div>
            </div>
        
            <button onclick="clearAllTasks()" class="bg-red-500 hover:bg-red-600 text-white rounded-lg px-4 py-2 w-full">Hapus Semua</button>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
